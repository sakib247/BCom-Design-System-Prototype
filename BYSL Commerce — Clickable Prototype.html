<style>*{box-sizing:border-box;margin:0}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#FCFCFC;--sf:#FFFFFF;--s2:#F9F9F9;--s3:#F0F0F0;--s4:#E8E8E8;--ln:#E0E0E0;--ln2:#D9D9D9;--ctl:#8D8D8D;--mut:#646464;--ink:#202020;--pri:#0A0A0A;--on-pri:#FFFFFF;--on-acc:#FFFFFF;
--gl:rgba(255,255,255,.56);--glt:rgba(255,255,255,.84);--gll:rgba(255,255,255,.75);--hl:rgba(255,255,255,.95);--sh:0 12px 32px rgba(0,0,0,.12);--sh2:0 24px 64px rgba(0,0,0,.18);
--ok:#16A34A;--ok-i:#15803D;--ok-b:#F0FDF4;--wa:#D97706;--wa-i:#B45309;--wa-b:#FFFBEB;--er:#DC2626;--er-i:#B91C1C;--er-b:#FEF2F2;--in:#2563EB;--in-i:#1D4ED8;--in-b:#EFF6FF;

--ui:clamp(14px,calc(.9vw + 4px),26px);color-scheme:light}
[data-palette=aurora]{--acc-l:#4F46E5;--acc-dk:#A5B4FC;--a1:#7C3AED;--a2:#06B6D4;--a3:#EC4899}
[data-palette=emerald]{--acc-l:#047857;--acc-dk:#6EE7B7;--a1:#059669;--a2:#F59E0B;--a3:#0F766E}
[data-palette=sunset]{--acc-l:#BE185D;--acc-dk:#F9A8D4;--a1:#F97316;--a2:#DB2777;--a3:#8B5CF6}
[data-palette=ocean]{--acc-l:#0E7490;--acc-dk:#67E8F9;--a1:#0EA5E9;--a2:#14B8A6;--a3:#6366F1}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#111111;--sf:#191919;--s2:#222222;--s3:#2A2A2A;--s4:#313131;--ln:#3A3A3A;--ln2:#484848;--ctl:#6E6E6E;--mut:#B4B4B4;--ink:#EEEEEE;--pri:#EEEEEE;--on-pri:#111111;--on-acc:#111111;--gl:rgba(34,34,34,.55);--glt:rgba(28,28,28,.86);--gll:rgba(255,255,255,.12);--hl:rgba(255,255,255,.12);--sh:0 12px 32px rgba(0,0,0,.5);--sh2:0 24px 64px rgba(0,0,0,.6);--ok-i:#4ADE80;--ok-b:rgba(22,163,74,.18);--wa-i:#FBBF24;--wa-b:rgba(217,119,6,.2);--er-i:#F87171;--er-b:rgba(220,38,38,.2);--in-i:#60A5FA;--in-b:rgba(37,99,235,.22);--acc:var(--acc-dk);--amb-o:.38;--amb-s:.16;color-scheme:dark}}
:root[data-theme=dark]{--bg:#111111;--sf:#191919;--s2:#222222;--s3:#2A2A2A;--s4:#313131;--ln:#3A3A3A;--ln2:#484848;--ctl:#6E6E6E;--mut:#B4B4B4;--ink:#EEEEEE;--pri:#EEEEEE;--on-pri:#111111;--on-acc:#111111;--gl:rgba(34,34,34,.55);--glt:rgba(28,28,28,.86);--gll:rgba(255,255,255,.12);--hl:rgba(255,255,255,.12);--sh:0 12px 32px rgba(0,0,0,.5);--sh2:0 24px 64px rgba(0,0,0,.6);--ok-i:#4ADE80;--ok-b:rgba(22,163,74,.18);--wa-i:#FBBF24;--wa-b:rgba(217,119,6,.2);--er-i:#F87171;--er-b:rgba(220,38,38,.2);--in-i:#60A5FA;--in-b:rgba(37,99,235,.22);--acc:var(--acc-dk);--amb-o:.38;--amb-s:.16;color-scheme:dark}
html,body{height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:var(--f);overflow:hidden;-webkit-font-smoothing:antialiased;line-height:1.45}
button{font:inherit;color:inherit}
.i{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
kbd{font-family:var(--fm);font-size:.82em;padding:.08em .45em;border-radius:.4em;background:var(--s3);border:1px solid var(--ln2);color:var(--ink)}
.gls,.glt{backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:1px solid var(--gll);box-shadow:inset 0 1px 0 var(--hl),var(--sh)}
.gls{background:var(--gl)}.glt{background:var(--glt)}
/* deck */
.deck{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);bottom:0}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;gap:clamp(14px,2.2vh,28px);padding:clamp(18px,4vh,52px) clamp(18px,4.5vw,88px) calc(clamp(18px,3vh,40px) + 72px + env(safe-area-inset-bottom,0px));overflow-x:hidden;overflow-y:auto;opacity:0;visibility:hidden;transform:translateX(28px);transition:opacity .4s ease,transform .5s cubic-bezier(.2,0,0,1),visibility 0s .5s}
.slide.on{opacity:1;visibility:visible;transform:none;transition:opacity .4s ease,transform .5s cubic-bezier(.2,0,0,1)}
.slide.past{transform:translateX(-28px)}
.slide>:not(.amb){position:relative;z-index:1}
.amb{position:absolute;inset:0;overflow:hidden;z-index:0;pointer-events:none;border-radius:inherit}
.amb i{position:absolute;width:70vmax;height:70vmax;border-radius:50%;opacity:var(--amb-o);animation:drift 24s ease-in-out infinite alternate;will-change:transform}
.slide:not(.on) .amb i{animation-play-state:paused}
.amb.soft i{opacity:var(--amb-s);width:54vmax;height:54vmax}
.amb i:nth-child(1){background:radial-gradient(circle,var(--a1) 0%,transparent 66%);left:-20%;top:-36%}
.amb i:nth-child(2){background:radial-gradient(circle,var(--a2) 0%,transparent 66%);right:-24%;top:-6%;animation-delay:-8s}
.amb i:nth-child(3){background:radial-gradient(circle,var(--a3) 0%,transparent 66%);left:16%;bottom:-50%;animation-delay:-16s}
@keyframes drift{to{transform:translate(7%,9%) scale(1.15)}}
/* type */
.sh{display:flex;flex-direction:column;gap:.3em;max-width:72em}
.kick{font-size:clamp(12px,.85vw,15px);font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--acc)}
h2{font-size:clamp(28px,3.1vw,54px);font-weight:600;letter-spacing:-.025em;line-height:1.08}
.lead{font-size:clamp(15px,1.2vw,22px);color:var(--mut);line-height:1.4;max-width:60em}
.body{flex:1;display:grid;grid-template-columns:minmax(0,1fr) clamp(260px,23vw,400px);gap:clamp(14px,1.8vw,30px);min-height:0}
.stage{overflow-x:clip;position:relative;min-height:clamp(320px,52vh,660px);border-radius:24px;display:flex;align-items:center;justify-content:center;padding:clamp(56px,6vh,76px) clamp(16px,3vw,48px) clamp(20px,4vh,48px);background:var(--sf);border:1px solid var(--ln);isolation:isolate;font-size:var(--ui)}
.stage>.amb{border-radius:24px}
.stage>:not(.amb){position:relative;z-index:1}
.stage>.dcur,.stage>.live,.stage>.toast,.stage>.keycap,.stage>.menu,.stage>.thl,.stage>.callout,.stage>.tipx{position:absolute}
.guide{display:flex;flex-direction:column;gap:1.15em;padding:1.4em 1.5em;border-radius:24px;background:var(--sf);border:1px solid var(--ln);font-size:clamp(14px,1.02vw,20px);align-self:start}
.guide h4{font-size:.76em;letter-spacing:.13em;text-transform:uppercase;color:var(--mut);margin-bottom:.45em;font-weight:600}
.guide ul{padding:0;list-style:none;display:flex;flex-direction:column;gap:.35em}
.guide li{display:flex;gap:.55em;align-items:flex-start;line-height:1.4}
.guide li .i{margin-top:.15em}
.guide .y .i{color:var(--ok-i)}.guide .n .i{color:var(--er-i)}
.guide .kb li{gap:.3em;align-items:center;flex-wrap:wrap}
.where{display:flex;gap:.4em;flex-wrap:wrap}
.where span{padding:.22em .8em;border-radius:99em;font-weight:600;font-size:.9em;border:1px solid var(--ln);color:var(--ctl)}
.where span.on{background:var(--pri);color:var(--on-pri);border-color:var(--pri)}
.note{font-size:.92em;color:var(--mut);padding:.8em .9em;border-radius:14px;background:var(--s2);border:1px solid var(--ln)}
@media (max-width:980px){.body{grid-template-columns:1fr}.stage{min-height:440px}}
/* nav bar */
.bar{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:100;display:flex;align-items:center;gap:2px;padding:5px;border-radius:99px;font-size:14px}
.bar button{display:grid;place-items:center;width:40px;height:40px;border:0;border-radius:50%;background:transparent;cursor:pointer}
.bar button:hover{background:color-mix(in srgb,var(--ink) 9%,transparent)}
.bar button:focus-visible,.lnk:focus-visible,.btn:focus-visible,.sw:focus-visible,.gcard:focus-visible{outline:none;box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--acc)}
.bar .cnt{font-weight:600;padding:0 8px;min-width:70px;text-align:center;color:var(--mut);font-variant-numeric:tabular-nums;white-space:nowrap}
.bar .sep{width:1px;height:22px;background:var(--ln);margin:0 4px}
.prog{position:fixed;left:0;top:env(safe-area-inset-top,0px);height:3px;background:var(--acc);z-index:101;transition:width .45s cubic-bezier(.2,0,0,1)}
.flash{position:fixed;left:50%;top:calc(18px + env(safe-area-inset-top,0px));transform:translate(-50%,-10px);z-index:102;padding:.55em 1.1em;border-radius:99px;font-weight:600;font-size:14px;opacity:0;transition:.3s;pointer-events:none}
.flash.show{opacity:1;transform:translate(-50%,0)}
.ovw{position:fixed;inset:0;z-index:120;padding:calc(28px + env(safe-area-inset-top,0px)) clamp(18px,5vw,80px) 40px;overflow:auto;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.ovw[hidden]{display:none}
.ovw h3{font-size:clamp(22px,2vw,32px);margin-bottom:.8em}
.ovw-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:22px}
.ovw-s h4{font-size:12px;letter-spacing:.13em;text-transform:uppercase;color:var(--acc);margin-bottom:8px}
.ovw-s button{display:flex;gap:10px;width:100%;text-align:left;padding:7px 10px;border:0;border-radius:10px;background:transparent;cursor:pointer;font-size:15px}
.ovw-s button:hover,.ovw-s button.cur{background:color-mix(in srgb,var(--ink) 8%,transparent)}
.ovw-s button span{color:var(--mut);font-variant-numeric:tabular-nums;min-width:22px}
/* cover and dividers */
.cov{flex:1;display:grid;grid-template-columns:1.15fr .85fr;align-items:center;gap:4vw}
.cov h1{font-size:clamp(56px,8.6vw,150px);font-weight:700;letter-spacing:-.05em;line-height:.95;margin:.12em 0 .18em}
.cov-sub{font-size:clamp(18px,1.8vw,30px);font-weight:500;line-height:1.3;max-width:20em}
.cov-meta{margin-top:.8em;font-size:clamp(14px,1.05vw,18px);color:var(--mut)}
.hints{display:flex;flex-wrap:wrap;gap:.6em 1.4em;margin-top:2em;font-size:clamp(13px,.95vw,16px);color:var(--mut)}
.hints span{display:flex;align-items:center;gap:.35em}
.cov-r{position:relative;height:min(62vh,560px);font-size:var(--ui)}
.fc{position:absolute;border-radius:22px;padding:1.1em 1.2em;animation:fl 7s ease-in-out infinite alternate}
.fc:nth-child(2){animation-duration:8.5s;animation-delay:-3s}.fc:nth-child(3){animation-duration:9.5s;animation-delay:-5s}
@keyframes fl{to{transform:translateY(-14px)}}
.divd{flex:1;display:flex;flex-direction:column;justify-content:center;gap:.6em;max-width:64em}
.dnum{font-size:clamp(80px,13vw,220px);font-weight:700;letter-spacing:-.06em;line-height:.85;color:transparent;-webkit-text-stroke:2px var(--ink);opacity:.85}
.divd h1{font-size:clamp(40px,5.4vw,92px);font-weight:700;letter-spacing:-.04em;line-height:1}
.divd .lead{font-size:clamp(17px,1.5vw,26px)}
/* common UI */
.btn{font-weight:600;font-size:1em;padding:.62em 1.1em;border-radius:.72em;border:1px solid transparent;cursor:pointer;white-space:nowrap}
.btn.pri{background:var(--pri);color:var(--on-pri)}
.btn.sec{background:var(--sf);border-color:var(--ctl)}
.btn.acc{background:var(--acc);color:var(--on-acc)}
.btn:disabled{background:var(--s3);color:var(--ctl);border-color:transparent;cursor:not-allowed}
.lnk{color:var(--acc);font-weight:600;text-decoration:underline;text-underline-offset:.2em;background:none;border:0;padding:0;cursor:pointer;font-size:1em}
.sw{width:2.6em;height:1.5em;border-radius:99em;background:var(--ctl);position:relative;border:0;cursor:pointer;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:.15em;left:.15em;width:1.2em;height:1.2em;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .25s cubic-bezier(.2,0,0,1)}
.sw[aria-checked=true],.sw.on{background:var(--acc)}
.sw[aria-checked=true]::after,.sw.on::after{transform:translateX(1.1em)}
.sw:disabled{opacity:.6;cursor:not-allowed}
.av{width:1.75em;height:1.75em;border-radius:50%;display:grid;place-items:center;font-size:.74em;font-weight:700;background:var(--s3);color:var(--ink);flex:none}
.pill{font-size:.78em;font-weight:600;padding:.15em .6em;border-radius:99em;white-space:nowrap}
.pill.ok{background:var(--ok-b);color:var(--ok-i)}.pill.er{background:var(--er-b);color:var(--er-i)}.pill.wa{background:var(--wa-b);color:var(--wa-i)}
.st{display:inline-flex;align-items:center;gap:.4em;padding:.15em .65em;border-radius:99em;font-size:.82em;font-weight:600;background:var(--s3);color:var(--mut);white-space:nowrap}
.st::before{content:"";width:.5em;height:.5em;border-radius:50%;background:currentColor}
.st.ok{background:var(--ok-b);color:var(--ok-i)}.st.wa{background:var(--wa-b);color:var(--wa-i)}.st.er{background:var(--er-b);color:var(--er-i)}.st.in{background:var(--in-b);color:var(--in-i)}
.spark{width:100%;height:2.2em;fill:none;stroke:var(--ink);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.spark.acc{stroke:var(--acc)}
.spin{width:1em;height:1em;border:2px solid var(--ln);border-top-color:var(--acc);border-radius:50%;animation:rot .8s linear infinite;flex:none;display:inline-block}
.spin[hidden]{display:none}
@keyframes rot{to{transform:rotate(360deg)}}
/* field / select */
.fld{position:relative;display:flex;flex-direction:column;gap:.4em;width:min(24em,100%)}
.lbl{font-size:.93em;font-weight:500}
.ctl{display:flex;align-items:center;gap:.55em;min-height:2.9em;padding:.3em .85em;background:var(--sf);border:1px solid var(--ctl);border-radius:.75em;cursor:pointer;transition:border-color .15s,box-shadow .15s;outline:none}
.ctl:hover{border-color:var(--mut)}
.fld.open .ctl,.ctl:focus-visible,.ctl:focus-within{border-color:var(--acc);box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--acc)}
.val{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:.55em}
.val.ph{color:var(--mut)}
.inp{flex:1;min-width:3em;border:0;outline:0;background:transparent;font:inherit;color:inherit;padding:.3em 0}
.inp::placeholder{color:var(--mut)}
.chev{color:var(--mut);transition:transform .22s}
.fld.open .chev{transform:rotate(180deg)}
.lead-i{color:var(--mut)}
.pop{position:absolute;left:0;right:0;top:calc(100% + .45em);z-index:40;max-height:16em;overflow:auto;padding:.35em;border-radius:.95em;background:var(--glt);backdrop-filter:blur(28px) saturate(180%);-webkit-backdrop-filter:blur(28px) saturate(180%);border:1px solid var(--gll);box-shadow:inset 0 1px 0 var(--hl),var(--sh2);transform-origin:top;animation:pop .2s cubic-bezier(.2,0,0,1)}
.pop[hidden]{display:none}
.fld:has(.help) .pop{top:calc(100% - 1.3em)}
@keyframes pop{from{opacity:0;transform:translateY(-6px) scale(.98)}}
.opt{display:flex;align-items:center;gap:.6em;padding:.5em .65em;border-radius:.6em;cursor:pointer;transition:background .12s}
.opt.hi{background:color-mix(in srgb,var(--ink) 7%,transparent)}
.opt.sel{font-weight:600}
.opt .ck{margin-left:auto;color:var(--acc);visibility:hidden}
.opt.sel .ck{visibility:visible}
.opt.dis{opacity:.45;cursor:not-allowed}
.opt mark{background:color-mix(in srgb,var(--acc) 24%,transparent);color:inherit;border-radius:.2em;padding:0 .05em}
.opt .meta{margin-left:auto}
.ol{display:flex;flex-direction:column;min-width:0}
.ol small{font-family:var(--fm);font-size:.78em;color:var(--mut);font-weight:400}
.grp{padding:.65em .65em .3em;font-size:.74em;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--mut)}
.empty{display:flex;align-items:center;gap:.6em;flex-wrap:wrap;padding:.85em .7em;color:var(--mut)}
.box{width:1.15em;height:1.15em;border:1.5px solid var(--ctl);border-radius:.32em;display:grid;place-items:center;flex:none;transition:.15s}
.box .i{width:.85em;height:.85em;opacity:0;color:var(--on-acc);stroke-width:3}
.opt.sel .box{background:var(--acc);border-color:var(--acc)}
.opt.sel .box .i{opacity:1}
.chips{display:flex;gap:.35em;flex-wrap:nowrap;min-width:0}
.chips:empty{display:none}
.chip{display:inline-flex;align-items:center;gap:.25em;padding:.18em .25em .18em .7em;border-radius:99em;background:color-mix(in srgb,var(--acc) 14%,transparent);color:var(--acc);font-weight:600;font-size:.88em;white-space:nowrap;animation:pop .2s}
.chip.more{padding-right:.7em}
.chip button{display:grid;place-items:center;width:1.45em;height:1.45em;border:0;border-radius:50%;background:transparent;color:inherit;cursor:pointer}
.chip button:hover{background:color-mix(in srgb,var(--acc) 18%,transparent)}
.chip .i{width:.85em;height:.85em}
.help{font-size:.86em;color:var(--mut)}
.fld.err .ctl{border-color:var(--er)}.fld.err .help{color:var(--er-i)}
.fld.is-dis .ctl{background:var(--s3);border-color:var(--ln);color:var(--ctl);cursor:not-allowed}
.fld.is-dis .lbl{color:var(--ctl)}
/* demo engine */
.dcur{left:0;top:0;width:26px;height:26px;z-index:80;pointer-events:none;opacity:0;transition:transform .62s cubic-bezier(.2,0,0,1),opacity .3s}
.dcur.show{opacity:1}
.dcur svg{width:26px;height:26px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.35))}
.dcur::after{content:"";position:absolute;left:-8px;top:-10px;width:22px;height:22px;border-radius:50%;background:var(--acc);opacity:0}
.dcur.press::after{animation:rip .5s ease-out}
@keyframes rip{0%{opacity:.55;transform:scale(.3)}100%{opacity:0;transform:scale(2.4)}}
.live{top:16px;left:16px;z-index:70;display:flex;align-items:center;gap:.5em;padding:.38em .85em;border-radius:99em;font-size:13px;font-weight:600;border:0;cursor:pointer}
.live b{width:8px;height:8px;border-radius:50%;background:var(--er);animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.25}}
.keycap{z-index:75;display:flex;gap:.3em;font-size:1.1em;pointer-events:none;transition:opacity .25s;opacity:0}
.keycap.show{opacity:1}
.keycap kbd{font-size:1em;padding:.2em .6em;background:var(--pri);color:var(--on-pri);border:0;box-shadow:var(--sh)}
.toast{left:50%;bottom:22px;transform:translate(-50%,10px);z-index:75;display:flex;align-items:center;gap:.6em;padding:.65em 1.1em;border-radius:14px;font-weight:600;opacity:0;transition:.3s;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
.cap{min-height:1.5em;font-size:clamp(15px,1.1vw,20px);font-weight:500;text-align:center;transition:opacity .3s}
/* menu */
.menu{z-index:60;min-width:15em;padding:.35em;border-radius:.95em;animation:pop .18s cubic-bezier(.2,0,0,1)}
.mi{display:flex;align-items:center;gap:.65em;width:100%;padding:.5em .65em;border:0;border-radius:.6em;background:transparent;cursor:pointer;text-align:left;font-size:1em}
.mi.hi,.mi:hover{background:color-mix(in srgb,var(--ink) 7%,transparent)}
.mi .i{color:var(--mut)}
.mi kbd{margin-left:auto}
.mi.dg,.mi.dg .i{color:var(--er-i)}
.msep{height:1px;background:var(--ln);margin:.3em .4em}
/* color layers mock */
.lay{display:flex;flex-wrap:wrap;gap:.6em 1.6em;justify-content:center;margin-bottom:1em}
.lay label{display:flex;align-items:center;gap:.55em;font-weight:600}
.ldemo{display:flex;flex-direction:column;align-items:center;width:100%}
.mock{position:relative;width:min(100%,46em);border-radius:20px;overflow:hidden;display:grid;grid-template-columns:9.5em 1fr;gap:.8em;padding:.8em;background:var(--s2);border:1px solid var(--ln);isolation:isolate}
.mock>.amb{opacity:0;transition:opacity .9s;border-radius:20px}
.mock.c>.amb{opacity:1}
.mock>:not(.amb){position:relative;z-index:1}
.mk-nav{border-radius:14px;padding:.8em;display:flex;flex-direction:column;gap:.25em;font-size:.92em}
.mk-nav b{margin-bottom:.4em}
.mk-nav span{padding:.35em .6em;border-radius:.55em;color:var(--mut);transition:.4s}
.mk-nav span.on{background:color-mix(in srgb,var(--ink) 8%,transparent);color:var(--ink);font-weight:600}
.mock.c .mk-nav span.on{background:color-mix(in srgb,var(--acc) 16%,transparent);color:var(--acc)}
.mk-main{display:flex;flex-direction:column;gap:.7em;min-width:0}
.mk-top{border-radius:14px;padding:.6em .9em;display:flex;align-items:center;justify-content:space-between;gap:1em;font-weight:600}
.mk-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:.6em}
.mk-k{border-radius:14px;padding:.7em .8em;background:var(--sf);border:1px solid var(--ln)}
.mk-k p{font-size:.8em;color:var(--mut)}.mk-k strong{font-size:1.25em;display:block}
.mock.c .mk-k .spark{stroke:var(--acc)}
.mk-t{border-radius:14px;background:var(--sf);border:1px solid var(--ln);overflow:hidden;font-size:.9em}
.mk-t div{display:grid;grid-template-columns:1.2fr 1fr auto;gap:.8em;align-items:center;padding:.55em .9em;border-top:1px solid var(--s3)}
.mk-t div:first-child{border-top:0}
.mk-t div.sel{box-shadow:inset 3px 0 var(--ink);background:var(--s2)}
.mock.c .mk-t div.sel{box-shadow:inset 3px 0 var(--acc);background:color-mix(in srgb,var(--acc) 7%,var(--sf))}
.mk-t code{font-family:var(--fm);font-size:.92em}
.mock:not(.s) .mk-t .st{background:var(--s3)!important;color:var(--mut)!important}
/* palette slides */
.pbody{flex:1;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(280px,.75fr);gap:clamp(14px,1.8vw,30px)}
.pstage{position:relative;border-radius:24px;overflow:hidden;isolation:isolate;display:grid;place-items:center;padding:clamp(20px,3vw,48px);min-height:clamp(340px,58vh,720px);background:var(--bg);border:1px solid var(--ln);font-size:var(--ui)}
.pstage>.amb i{opacity:calc(var(--amb-o) + .12)}
.pm{display:grid;grid-template-columns:1fr 1fr;gap:1em;width:min(100%,42em)}
.pm-c{border-radius:20px;padding:1.1em 1.2em;display:flex;flex-direction:column;gap:.6em}
.pm-c.w{grid-column:span 2;flex-direction:row;flex-wrap:wrap;align-items:center;gap:.9em}
.pm-l{font-size:.85em;color:var(--mut)}
.pm-v{font-size:1.9em;font-weight:700;letter-spacing:-.02em;display:flex;align-items:baseline;gap:.4em;flex-wrap:wrap}
.pm-v span{font-size:.45em;color:var(--ok-i);font-weight:600}
.pm-sel{display:flex;align-items:center;justify-content:space-between;padding:.55em .8em;border-radius:.7em;background:var(--sf);border:1px solid var(--acc);box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--acc);font-weight:600}
.pm-list{display:flex;flex-direction:column;gap:.15em;padding:.3em;border-radius:.8em;background:var(--glt);border:1px solid var(--gll)}
.pm-list div{padding:.35em .6em;border-radius:.5em;display:flex;justify-content:space-between;align-items:center}
.pm-list .on{background:color-mix(in srgb,var(--acc) 13%,transparent);color:var(--acc);font-weight:600}
.pside{display:flex;flex-direction:column;gap:1em;padding:1.4em 1.5em;border-radius:24px;background:var(--sf);border:1px solid var(--ln);font-size:clamp(14px,.92vw,17px);align-self:start}
.pside h3{font-size:clamp(24px,2vw,34px);letter-spacing:-.02em;line-height:1.1}
.pside .mood{color:var(--mut)}
.swl{display:flex;flex-direction:column;gap:.45em}
.swr{display:grid;grid-template-columns:2.2em 1fr auto;gap:.7em;align-items:center}
.swr i{width:2.2em;height:2.2em;border-radius:.6em;border:1px solid var(--ln2)}
.swr p{line-height:1.25}.swr small{display:block;font-family:var(--fm);color:var(--mut);font-size:.82em}
.badge{font-size:.78em;font-weight:700;padding:.2em .55em;border-radius:.45em;white-space:nowrap}
.badge.pass{background:var(--ok-b);color:var(--ok-i)}.badge.fail{background:var(--er-b);color:var(--er-i)}.badge.deco{background:var(--s3);color:var(--mut)}
.watch{display:flex;gap:.6em;padding:.8em .9em;border-radius:14px;background:var(--wa-b);color:var(--ink)}
.watch .i{color:var(--wa-i);margin-top:.15em}
.tagpick{align-self:flex-start;padding:.25em .8em;border-radius:99em;background:var(--acc);color:var(--on-acc);font-weight:700;font-size:.85em}
/* guide cards */
.gg{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:clamp(10px,1.1vw,18px);flex:1;align-content:start}
.gcard{display:flex;flex-direction:column;gap:.5em;text-align:left;padding:1.2em 1.2em 1.1em;border-radius:20px;border:1px solid var(--ln);background:var(--sf);cursor:pointer;font-size:clamp(14px,1.05vw,20px);min-height:9em;transition:transform .25s,box-shadow .25s,border-color .25s;opacity:0;transform:translateY(14px)}
.slide.on .gcard{animation:rise .55s cubic-bezier(.2,0,0,1) forwards}
@keyframes rise{to{opacity:1;transform:none}}
.gcard:hover{transform:translateY(-3px);box-shadow:var(--sh);border-color:var(--acc)}
.gcard .q{color:var(--mut);font-size:.9em;line-height:1.35}
.gcard b{font-size:1.15em;letter-spacing:-.01em}
.gcard .mini{margin-top:auto;padding-top:.4em;display:flex;align-items:center;justify-content:space-between;color:var(--acc);font-weight:600;font-size:.88em}
.gcard.later{cursor:default}.gcard.later .mini{color:var(--mut)}
/* states */
.states{font-size:.86em;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1.1em;width:100%;align-items:start}
.stt{display:flex;flex-direction:column;gap:.5em;padding:.9em;border-radius:16px;border:1px solid transparent;transition:.35s;min-width:0}
.stt.spot{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 6%,var(--sf));box-shadow:var(--sh);transform:translateY(-4px)}
.stt .sl{font-size:.78em;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.stt .fld{width:100%}
.stt .val{font-size:.94em}
.stt .ctl{cursor:default}
.s-hov .ctl{border-color:var(--mut);background:var(--s2)}
.s-foc .ctl{border-color:var(--acc);box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--acc)}
.s-ro .ctl{background:var(--s3);border-color:transparent}
.mini-list{display:flex;flex-direction:column;padding:.3em;border-radius:.8em;background:var(--glt);border:1px solid var(--ln);box-shadow:var(--sh);font-size:.92em}
.mini-list div{padding:.3em .55em;border-radius:.45em}
.mini-list .hi{background:color-mix(in srgb,var(--ink) 7%,transparent)}
.stcap{margin-top:1.4em}
.sdemo{display:flex;flex-direction:column;align-items:center;width:100%}
/* cascade */
.casc{display:flex;flex-wrap:wrap;gap:1.2em;justify-content:center;width:100%}
.casc .fld{width:min(14em,100%)}
.addr{margin-top:1.6em;display:flex;align-items:center;gap:.6em;padding:.6em 1.1em;border-radius:99em;font-weight:600;opacity:.35;transition:.4s}
.addr.ok{opacity:1}
.cdemo{display:flex;flex-direction:column;align-items:center;width:100%}
/* phone + sheet */
.phone{position:relative;width:17em;height:28.5em;border-radius:2.6em;border:.6em solid #0A0A0A;background:var(--bg);overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--sh2)}
.ph-img{height:11.5em;position:relative;overflow:hidden;isolation:isolate;background:var(--s3)}
.ph-img .amb i{opacity:.9;width:22em;height:22em}
.ph-nav{position:absolute;left:.7em;right:.7em;top:.7em;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:.5em .9em;border-radius:99em;font-weight:700;letter-spacing:.12em;font-size:.85em}
.ph-b{padding:1em 1.1em;display:flex;flex-direction:column;gap:.65em;flex:1}
.ph-b h5{font-size:1.15em}
.ph-sz{display:flex;justify-content:space-between;align-items:center;padding:.65em .9em;border-radius:.75em;border:1px solid var(--ctl);background:var(--sf);cursor:pointer;font-weight:600}
.ph-sz span{color:var(--mut);font-weight:400}
.ph-add{margin-top:auto;text-align:center}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .3s;z-index:3}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:4;padding:.6em 1em 1.2em;border-radius:1.6em 1.6em 0 0;transform:translateY(105%);transition:transform .42s cubic-bezier(.2,0,0,1);display:flex;flex-direction:column;gap:.3em}
.phone.open .scrim{opacity:1;pointer-events:auto}
.phone.open .sheet{transform:none}
.grab{width:2.6em;height:.3em;border-radius:99em;background:var(--ctl);align-self:center;margin-bottom:.5em}
.sheet h5{font-size:1.05em;margin-bottom:.3em}
.so{display:flex;justify-content:space-between;align-items:center;padding:.7em .8em;border-radius:.7em;border:0;background:transparent;cursor:pointer;font-size:1em;text-align:left}
.so.sel{background:color-mix(in srgb,var(--acc) 13%,transparent);color:var(--acc);font-weight:700}
.so:disabled{color:var(--ctl);cursor:not-allowed;text-decoration:line-through}
.so small{font-size:.8em;text-decoration:none;color:var(--mut)}
.shdemo{display:flex;gap:3em;align-items:center;justify-content:center;flex-wrap:wrap}
.vs{display:flex;flex-direction:column;gap:.5em;max-width:14em;color:var(--mut)}
.vs b{color:var(--ink)}
/* menu slide */
.mdemo{display:grid;grid-template-columns:1fr 1.25fr;gap:2em;width:100%;align-items:start}
.ocard{border-radius:18px;background:var(--sf);border:1px solid var(--ln);padding:1.1em 1.2em;display:flex;flex-direction:column;gap:.5em;box-shadow:var(--sh)}
.ocard .top{display:flex;align-items:center;justify-content:space-between;gap:.6em}
.ocard code{font-family:var(--fm);font-weight:600}
.dots{display:grid;place-items:center;width:2.3em;height:2.3em;border-radius:.6em;border:1px solid var(--ln);background:var(--sf);cursor:pointer}
.mtab{border-radius:18px;background:var(--sf);border:1px solid var(--ln);overflow:hidden;box-shadow:var(--sh)}
.mtab div{display:grid;grid-template-columns:1.3fr 1fr auto;gap:.8em;align-items:center;padding:.7em 1em;border-top:1px solid var(--s3);cursor:context-menu}
.mtab div:first-child{border-top:0;color:var(--mut);font-size:.82em;font-weight:600;letter-spacing:.06em;text-transform:uppercase;cursor:default}
.mtab div.ctx{background:color-mix(in srgb,var(--acc) 8%,var(--sf))}
.mtab code{font-family:var(--fm)}
.mlabel{font-size:.8em;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin-bottom:.6em}
/* scope */
.app{min-width:0;width:min(100%,46em);display:flex;flex-direction:column;gap:.9em;position:relative}
.app-top{display:flex;align-items:center;gap:.9em;padding:.55em .7em .55em 1em;border-radius:16px}
.app-top b{white-space:nowrap}
.scope-t{display:flex;align-items:center;gap:.55em;padding:.45em .85em;border-radius:99em;border:1px solid var(--ln);background:var(--sf);cursor:pointer;font-weight:600;font-size:.95em;min-width:0}
.scope-t span.tx{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scope-t[aria-expanded=true]{border-color:var(--acc);box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--acc)}
.bdot{width:.7em;height:.7em;border-radius:50%;background:var(--ctl);flex:none;transition:.3s}
.bdot.on{background:var(--acc)}
.sp{flex:1}
.scope-pop{position:absolute;left:0;right:0;top:3.9em;z-index:30;display:grid;grid-template-columns:repeat(3,1fr);gap:.4em;padding:.6em;border-radius:18px;animation:pop .2s cubic-bezier(.2,0,0,1)}
.scope-pop[hidden]{display:none}
.sc-col{display:flex;flex-direction:column;gap:.15em}
.sc-col h5{font-size:.72em;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);padding:.3em .6em}
.sco{display:flex;align-items:center;justify-content:space-between;gap:.4em;padding:.45em .6em;border:0;border-radius:.55em;background:transparent;cursor:pointer;text-align:left;font-size:.95em}
.sco:hover{background:color-mix(in srgb,var(--ink) 7%,transparent)}
.sco.sel{background:color-mix(in srgb,var(--acc) 14%,transparent);color:var(--acc);font-weight:700}
.sco.all{color:var(--mut)}.sco.all.sel{color:var(--acc)}
.app-main{border-radius:16px;background:var(--sf);border:1px solid var(--ln);padding:1.1em 1.2em;display:flex;flex-direction:column;gap:.7em}
.app-main h5{font-size:1.4em;letter-spacing:-.01em}
.app-main p{color:var(--mut)}
.app-act{display:flex;align-items:center;gap:.9em;flex-wrap:wrap}
.why{display:flex;align-items:center;gap:.45em;font-size:.9em;color:var(--mut)}
.why.ok{color:var(--ok-i)}
.kt{display:grid;grid-template-columns:repeat(3,1fr);gap:.6em}
.kt div{border-radius:12px;background:var(--s2);padding:.6em .8em}
.kt small{color:var(--mut);display:block;font-size:.8em}
.kt strong{font-size:1.15em;font-variant-numeric:tabular-nums}
/* next */
.ng{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(10px,1vw,16px);flex:1;align-content:start}
.nc{padding:1.1em 1.2em;border-radius:18px;border:1px solid var(--ln);background:var(--sf);display:flex;flex-direction:column;gap:.35em;font-size:clamp(14px,1vw,19px)}
.nc.done{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 7%,var(--sf))}
.nc small{font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--acc);font-size:.75em}
.nc p{color:var(--mut);font-size:.92em;line-height:1.4}
@media (max-width:1180px){.gg{grid-template-columns:repeat(3,minmax(0,1fr))}.states{grid-template-columns:repeat(3,minmax(0,1fr))}.ng{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:980px){.cov{grid-template-columns:1fr}.cov-r{display:none}.pbody{grid-template-columns:1fr}.mdemo{grid-template-columns:1fr}}
@media (max-width:640px){.app-top b{display:none}.app-top{gap:.5em}.scope-t{flex:1}.app-act{flex-direction:column;align-items:flex-start}.gg{grid-template-columns:repeat(2,minmax(0,1fr))}.states{grid-template-columns:repeat(2,minmax(0,1fr))}.ng{grid-template-columns:1fr}.mock{grid-template-columns:1fr}.mk-nav{display:none}.mk-kpis{grid-template-columns:1fr 1fr}.mk-kpis>:nth-child(3){display:none}.pm{grid-template-columns:1fr}.pm-c.w{grid-column:auto}.scope-pop{grid-template-columns:1fr}.kt{grid-template-columns:1fr 1fr}.bar .cnt{min-width:56px}}
@media (prefers-reduced-motion:reduce){.amb i,.fc,.live b{animation:none}.slide,.dcur{transition:none}.gcard{opacity:1;transform:none}.slide.on .gcard{animation:none}}
:root{--bg:#FCFCFC;--sf:#FFFFFF;--s2:#F9F9F9;--s3:#F0F0F0;--s4:#E8E8E8;--ln:#E0E0E0;--ln2:#D9D9D9;--ctl:#8D8D8D;--mut:#646464;--ink:#202020;--pri:#0A0A0A;--on-pri:#FFFFFF;--pri-h:#262626;--pri-p:#1A1A1A;--gl:rgba(255,255,255,.62);--glt:rgba(255,255,255,.86);--gll:rgba(255,255,255,.8);--hl:rgba(255,255,255,.95);--sh:0 1px 2px rgba(0,0,0,.04),0 4px 14px rgba(0,0,0,.06);--sh2:0 16px 48px rgba(0,0,0,.14);--ok-b:#E6F6EB;--ok:#30A46C;--ok-i:#18794E;--wa-b:#FFF7C2;--wa:#FFC53D;--wa-i:#946200;--er-b:#FEEBEC;--er:#E5484D;--er-i:#C4282D;--er-s:#CE2C31;--in-b:#E6F4FE;--in:#0090FF;--in-i:#0B68B7;--acc-3:var(--acc3-l);--acc-10:var(--acc10-l);--acc:var(--acc11-l);--acc-s:var(--accs-l);--on-acc:var(--onacc-l);--cv-b:#F4F0FE;--cv:#6550B9;--cc-b:#DEF7F9;--cc:#0C6E87;--co-b:#FFEFD6;--co:#B04300;--cp-b:#FEE9F5;--cp:#B4237F;--cg-b:#F2F0E7;--cg:#71624B;color-scheme:light}

[data-accent=indigo]{--acc3-l:#EDF2FE;--acc3-d:#182449;--acc9:#3E63DD;--acc10-l:#3358D4;--acc10-d:#5472E4;--acc11-l:#3A5BC7;--acc11-d:#9EB1FF;--accs-l:#3E63DD;--accs-d:#3E63DD;--onacc-l:#FFFFFF;--onacc-d:#FFFFFF}

/* grid */
.vpw{width:100%;display:flex;flex-direction:column;align-items:center;gap:.8em}
.vp{container-type:inline-size;width:100%;max-width:100%;transition:width .9s cubic-bezier(.2,0,0,1);border-radius:14px;border:1px solid var(--ln2);background:var(--bg);overflow:hidden;position:relative}
.vpi{position:relative;display:grid;grid-template-columns:10em 1fr;gap:12px;padding:14px;min-height:15em}
.vcols{position:absolute;inset:0 14px;display:grid;grid-template-columns:repeat(12,1fr);gap:12px;pointer-events:none}
.vcols i{background:color-mix(in srgb,var(--acc-s) 12%,transparent);border-left:1px solid color-mix(in srgb,var(--acc-s) 30%,transparent);border-right:1px solid color-mix(in srgb,var(--acc-s) 30%,transparent)}
.vside{border-radius:10px;background:var(--s3);position:relative;z-index:1}
.vmain{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;position:relative;z-index:1;align-content:start}
.vmain i{height:4.5em;border-radius:10px;background:var(--sf);border:1px solid var(--ln)}
.vmain i.w{grid-column:1/-1;height:6em}
@container (max-width:900px){.vcols{grid-template-columns:repeat(8,1fr)}.vpi{grid-template-columns:4em 1fr}}
@container (max-width:560px){.vcols{grid-template-columns:repeat(4,1fr)}.vpi{grid-template-columns:1fr}.vside{height:2.4em}.vmain{grid-template-columns:1fr 1fr}}
.vplab{font-weight:600}
/* shape */
.rads{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1em;width:100%;font-size:clamp(13px,1vw,19px)}
.rad{display:flex;flex-direction:column;gap:.45em;align-items:center;text-align:center}
.rad i{width:100%;aspect-ratio:1;max-width:6em;background:var(--acc-3);border:2px solid var(--acc-s)}
.rad b{font-family:var(--fm)}.rad span{color:var(--mut);line-height:1.3}
.nest{display:flex;flex-direction:column;align-items:center;gap:.8em;margin-top:1.6em}
.nout{background:var(--s4);border-radius:28px;transition:padding .8s cubic-bezier(.2,0,0,1)}
.nin{width:16em;height:5em;background:var(--sf);border:1px solid var(--ln);transition:border-radius .8s cubic-bezier(.2,0,0,1)}
.neq{font-family:var(--fm);font-weight:600}
/* elevation */
.elv{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:1em;width:100%;font-size:clamp(13px,1vw,19px);align-items:end}
.el{border-radius:14px;padding:1em;min-height:7.5em;display:flex;flex-direction:column;justify-content:flex-end;gap:.2em;background:var(--sf);border:1px solid var(--ln)}
.el b{font-family:var(--fm);font-size:1.4em}.el span{color:var(--mut);line-height:1.3}
.edemo{display:flex;gap:2em;align-items:flex-start;justify-content:center;margin-top:1.6em;position:relative;width:100%}
.ecard{width:15em;padding:1em;border-radius:14px;background:var(--sf);border:1px solid var(--ln);box-shadow:var(--sh);transition:box-shadow .3s,transform .3s;display:flex;flex-direction:column;gap:.5em}
.ecard.up{box-shadow:var(--sh2);transform:translateY(-4px)}
.escrim{position:absolute;inset:-2em;background:rgba(0,0,0,.28);border-radius:20px;opacity:0;transition:.3s;pointer-events:none;z-index:5}
.edlg{position:absolute;left:50%;top:50%;transform:translate(-50%,-40%) scale(.96);opacity:0;transition:.3s;z-index:6;width:19em;padding:1.2em;border-radius:20px;background:var(--glt);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--gll);box-shadow:var(--sh2);display:flex;flex-direction:column;gap:.7em;pointer-events:none}
.edemo.modal .escrim{opacity:1}.edemo.modal .edlg{opacity:1;transform:translate(-50%,-50%)}
/* icons */
.icg{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:.6em;font-size:clamp(13px,.85vw,16px)}
.icx{display:flex;flex-direction:column;align-items:center;gap:.35em;padding:.8em .3em;border-radius:12px;background:var(--sf);border:1px solid var(--ln);color:var(--mut)}
.icx .i{width:1.6em;height:1.6em;color:var(--ink);stroke-width:1.75}
.icsz{display:flex;gap:2em;align-items:flex-end}
.icsz div{display:flex;flex-direction:column;align-items:center;gap:.4em;color:var(--mut);font-size:.9em}
.icbar{display:flex;gap:.4em;padding:.4em;border-radius:14px;background:var(--sf);border:1px solid var(--ln);box-shadow:var(--sh)}
.icb{display:grid;place-items:center;width:2.6em;height:2.6em;border-radius:.6em;border:0;background:transparent;color:var(--mut);cursor:pointer;position:relative;transition:.2s}
.icb .i{width:1.25em;height:1.25em}
.icb:hover,.icb.is-h{background:var(--s3);color:var(--ink)}
.icb.act{background:var(--acc-3);color:var(--acc)}
.icb .dotn{position:absolute;right:.55em;top:.5em;width:.55em;height:.55em;border-radius:50%;background:var(--er);box-shadow:0 0 0 2px var(--sf)}
/* motion */
.mo{display:flex;flex-direction:column;gap:.7em;width:100%;font-size:clamp(13px,1vw,19px)}
.mor{display:grid;grid-template-columns:9em 1fr 12em;gap:1em;align-items:center}
.mor code{font-family:var(--fm)}
.trk{height:1.6em;border-radius:99em;background:var(--s3);position:relative}
.trk i{position:absolute;left:.2em;top:.2em;width:1.2em;height:1.2em;border-radius:50%;background:var(--acc-s)}
.trk.go i{left:calc(100% - 1.4em)}
.mor span{color:var(--mut)}
.eas{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1em;margin-top:1em}
.ea{padding:1em;border-radius:14px;background:var(--sf);border:1px solid var(--ln);display:flex;flex-direction:column;gap:.4em}
.ea svg{width:100%;height:5em}
.ea code{font-family:var(--fm);font-size:.82em;color:var(--mut)}
/* button matrix */
.bm{display:grid;grid-template-columns:13em repeat(6,minmax(0,1fr));gap:.7em .6em;align-items:center;width:100%}
.bm .h{font-size:.74em;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);text-align:center}
.bm .vn b{display:block}.bm .vn small{display:block;color:var(--mut);font-size:.78em;line-height:1.3;font-family:var(--fm)}
.bm .c{display:flex;justify-content:center}
.thl{position:absolute;top:16px;right:16px;z-index:70;font-weight:700;font-size:13px;padding:.35em .8em;border-radius:99em;background:var(--sf);border:1px solid var(--ln)}
.bsz{display:flex;gap:1.6em;align-items:flex-end;flex-wrap:wrap;justify-content:center}
.bsz div{display:flex;flex-direction:column;align-items:center;gap:.5em;color:var(--mut);font-size:.9em;text-align:center}
.b.r32{height:32px;font-size:13px;padding:0 12px;border-radius:8px}.b.r40{height:40px;font-size:14px;padding:0 16px;border-radius:10px}.b.r48{height:48px;font-size:16px;padding:0 20px;border-radius:12px}.b.r56{height:56px;font-size:17px;padding:0 24px;border-radius:14px}
.rules{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1em;margin-top:1.5em;width:100%}
.rl3{padding:1em;border-radius:14px;background:var(--sf);border:1px solid var(--ln);display:flex;flex-direction:column;gap:.6em}
.rl3 p{font-weight:600}.rl3 .ex{display:flex;gap:.5em;flex-wrap:wrap;align-items:center;padding:.7em;border-radius:10px;background:var(--s2)}
.rl3 .ex.bad{background:var(--er-b)}.rl3 .ex.bad::before{content:"Don’t";font-size:.75em;font-weight:700;color:var(--er-i);width:100%}.rl3 .ex.good::before{content:"Do";font-size:.75em;font-weight:700;color:var(--ok-i);width:100%}
.blive{display:flex;flex-direction:column;align-items:center;gap:1.6em;width:100%}
.brow{display:flex;gap:.9em;flex-wrap:wrap;justify-content:center;align-items:center}
.tipx{position:absolute;z-index:66;padding:.45em .8em;border-radius:10px;background:var(--pri);color:var(--on-pri);font-size:.85em;font-weight:500;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap}
.tipx.show{opacity:1}
.ctx3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1.2em;width:100%;align-items:start}
.cx{padding:1.1em;border-radius:16px;background:var(--sf);border:1px solid var(--ln);box-shadow:var(--sh);display:flex;flex-direction:column;gap:.8em;position:relative;min-height:14em}
.cx h5{font-size:.78em;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.cx .fake{height:2.4em;border-radius:.55em;border:1px solid var(--ctl);background:var(--sf);display:flex;align-items:center;padding:0 .7em;color:var(--mut)}
.cx .acts{display:flex;gap:.5em;justify-content:flex-end;margin-top:auto;flex-wrap:wrap}
.dlg{position:absolute;inset:0;border-radius:16px;background:rgba(0,0,0,.3);display:grid;place-items:center;opacity:0;pointer-events:none;transition:.25s;z-index:5}
.dlg.show{opacity:1;pointer-events:auto}
.dlg>div{width:88%;padding:1em;border-radius:14px;background:var(--glt);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--gll);box-shadow:var(--sh2);display:flex;flex-direction:column;gap:.6em}
.tbar{display:flex;gap:.4em;align-items:center;flex-wrap:wrap}
.bgrp{display:flex;border:1px solid var(--ctl);border-radius:.62em;overflow:hidden}
.bgrp button{height:2.4em;padding:0 .9em;border:0;background:var(--sf);font-weight:600;cursor:pointer;border-left:1px solid var(--ln)}
.bgrp button:first-child{border-left:0}.bgrp button.on{background:var(--acc-3);color:var(--acc)}
.split{display:flex;border-radius:.62em;overflow:hidden;background:var(--pri)}
.split button{height:2.6em;border:0;background:transparent;color:var(--on-pri);font-weight:600;cursor:pointer;padding:0 1em}
.split button+button{padding:0 .7em;border-left:1px solid color-mix(in srgb,var(--on-pri) 25%,transparent)}
.smenu{position:absolute;right:1.1em;top:7.4em;z-index:6;min-width:12em;padding:.3em;border-radius:12px;background:var(--glt);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--gll);box-shadow:var(--sh2);display:none}
.smenu.show{display:block;animation:pop .18s}
.smenu div{padding:.45em .65em;border-radius:.5em}.smenu div.hi{background:var(--s3)}
@media (max-width:1180px){.lv{grid-template-columns:1fr 1fr}.lva{display:none}.roles{grid-template-columns:1fr 1fr}.icg{grid-template-columns:repeat(6,minmax(0,1fr))}.elv{grid-template-columns:repeat(3,minmax(0,1fr))}.rads{grid-template-columns:repeat(4,minmax(0,1fr))}.ctx3{grid-template-columns:1fr}.ld{grid-template-columns:1fr 1fr}.ldmap{grid-column:1/-1}}
@media (max-width:980px){.two,.tf3,.acc3{grid-template-columns:1fr}.sw12{grid-template-columns:4em repeat(6,minmax(0,1fr))}.sw12 .use12{display:none}.bm{grid-template-columns:9em repeat(3,minmax(0,1fr))}.bm .opt-col{display:none}.rules{grid-template-columns:1fr}.shop{flex-direction:column;align-items:center}}
@media (max-width:640px){.lv,.roles{grid-template-columns:1fr}.kp{grid-template-columns:1fr}.ld{grid-template-columns:1fr}.icg{grid-template-columns:repeat(4,minmax(0,1fr))}.elv{grid-template-columns:repeat(2,minmax(0,1fr))}.mor{grid-template-columns:6em 1fr}.mor span{display:none}.eas{grid-template-columns:1fr}.cmp{grid-template-columns:1fr}}
@media (max-height:800px){.tbl td{padding:.36em .6em}.tbl th{padding:.35em .6em}.panel{padding:1em 1.1em}.cmp{margin-top:.7em}}
.panel{min-width:0;overflow-x:auto}.two>*,.body>*{min-width:0}
/* mobile and short-screen safety: blocks never shrink below their content */
.slide>.stage,.slide>.panel,.slide>.body,.slide>.two,.slide>.pbody{flex:1 0 auto!important}
.stage{justify-content:safe center;align-items:safe center}
.body>.stage{height:auto}
@media (max-width:980px){
 .stage{min-height:0;padding:64px 14px 22px}
 .shop{gap:1em}.pcard,.cart{width:100%;max-width:20em}.cart{transform:none}
 .ld{grid-template-columns:1fr}
 .bm{grid-template-columns:7em repeat(6,minmax(4.8em,1fr));min-width:40em;gap:.6em .4em;font-size:.85em}.bm .vn small{display:none}.bm .c.opt-col{display:flex!important}.bm .h.opt-col{display:block!important}
 #bm-stage{overflow-x:auto;justify-content:flex-start}
 .two{grid-template-columns:1fr!important}
 .bsz{gap:1em}.rules{margin-top:1em}
 .mor{grid-template-columns:7.5em 1fr}.mor span{display:none}.mor code{font-size:.85em}
 .ctx3{grid-template-columns:1fr}
 .icg{grid-template-columns:repeat(5,minmax(0,1fr))}.icsz{gap:1.2em}
 .elv{grid-template-columns:repeat(3,minmax(0,1fr))}.el{transform:none!important;min-height:6em}
 .rads{grid-template-columns:repeat(4,minmax(0,1fr))}
 .nin{width:12em}
 .spc{padding:24px}
 .dash{padding:.8em}.kp{grid-template-columns:1fr}.rw{grid-template-columns:1fr auto;row-gap:.2em}.rw span:nth-child(2){display:none}
 .lv{grid-template-columns:1fr}.lva{display:none}
}
@media (max-width:420px){.icg{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:980px){.dh{flex-wrap:wrap}.dh .sp{display:none}.kpi{min-width:0}.kpi>div{min-width:0}}
.pcard>div:has(.szs){flex-wrap:wrap;gap:.5em}
/* ===== Part 2: inputs and selection ===== */
.tf{display:flex;flex-direction:column;gap:.4em;width:min(22em,100%);min-width:0;position:relative}
.tf .lbl .req{color:var(--er-i);margin-left:.15em}.tf .lbl .optl{color:var(--mut);font-weight:400}
.ib{display:flex;align-items:center;gap:.55em;height:2.75em;padding:0 .85em;border:1px solid var(--ctl);border-radius:.65em;background:var(--sf);transition:border-color .15s,box-shadow .15s;min-width:0}
.ib:hover,.tf.hov .ib{border-color:var(--mut)}
.ib:focus-within,.tf.is-f .ib{border-color:var(--acc);box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--acc)}
.ib .in{flex:1;min-width:0;border:0;outline:0;background:transparent;font:inherit;color:var(--ink);padding:0;height:100%}
.ib .in::placeholder{color:var(--mut)}
.ib>.i{color:var(--mut)}
.pre,.suf{color:var(--mut);font-weight:600;white-space:nowrap}
.pre.seg{padding-right:.65em;border-right:1px solid var(--ln);align-self:stretch;display:flex;align-items:center}
.ia{display:grid;place-items:center;width:1.9em;height:1.9em;border:0;border-radius:.5em;background:transparent;color:var(--mut);cursor:pointer;flex:none}
.ia:hover{background:var(--s3);color:var(--ink)}.ia[hidden]{display:none}
.tf .help{display:flex;gap:.4em;align-items:flex-start;min-height:1.3em;font-size:.86em;color:var(--mut)}
.tf .help .cnt2{margin-left:auto;font-variant-numeric:tabular-nums;white-space:nowrap}
.tf .help .cnt2.wa{color:var(--wa-i);font-weight:600}
.tf.err .ib{border-color:var(--er)}.tf.err .help{color:var(--er-i)}
.tf.err .ib:focus-within,.tf.err.is-f .ib{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--er)}
.tf.ok .ib{border-color:var(--ok)}.tf.ok .help{color:var(--ok-i)}
.tf.dis .ib{background:var(--s3);border-color:var(--ln);cursor:not-allowed}.tf.dis .in,.tf.dis .lbl{color:var(--ctl)}
.tf.ro .ib{background:var(--s3);border-color:transparent}
.tf.big{font-size:1.4em;width:min(24em,100%)}
.str{display:flex;gap:.3em;align-items:center}.str i{flex:1;height:.32em;border-radius:99em;background:var(--s4);transition:background .3s}
.str.l1 i:nth-child(1){background:var(--er)}.str.l2 i:nth-child(-n+2){background:var(--wa)}.str.l3 i:nth-child(-n+3){background:var(--ok)}.str.l4 i:nth-child(-n+4){background:var(--ok)}
.str span{font-size:.85em;font-weight:600;min-width:4.2em;text-align:right;color:var(--mut)}
.stp{display:flex;align-items:center;border:1px solid var(--ctl);border-radius:.65em;overflow:hidden;height:2.75em;width:fit-content;background:var(--sf)}
.stp button{width:2.75em;height:100%;border:0;background:transparent;cursor:pointer;font-size:1.15em;color:var(--ink)}
.stp button:hover{background:var(--s3)}.stp button:disabled{color:var(--ctl);cursor:not-allowed;background:transparent}
.stp input{width:3em;text-align:center;border:0;border-left:1px solid var(--ln);border-right:1px solid var(--ln);height:100%;font:inherit;font-weight:600;background:transparent;color:var(--ink);outline:0;font-variant-numeric:tabular-nums}
.otp{display:flex;gap:.45em}
.otp input{width:2.3em;height:2.8em;text-align:center;font:600 1.15em var(--fm);border:1px solid var(--ctl);border-radius:.6em;background:var(--sf);color:var(--ink);outline:0;padding:0;transition:border-color .15s,box-shadow .15s}
.otp input:focus,.otp input.is-f{border-color:var(--acc);box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--acc)}
.otp.ok input{border-color:var(--ok)}
.ta{width:100%;min-height:5em;resize:none;border:0;outline:0;background:transparent;font:inherit;color:var(--ink);line-height:1.5;padding:.65em 0;overflow:hidden;display:block}
.ib.tab{height:auto;align-items:flex-start}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.2em 1.6em;width:min(100%,46em)}
.grid2 .tf{width:100%}
.esum{display:flex;gap:.7em;padding:.8em 1em;border-radius:12px;background:var(--er-b);border-left:3px solid var(--er)}
.esum[hidden]{display:none}
.esum .i{color:var(--er-i);margin-top:.15em}.esum b{color:var(--er-i)}
.esum button{border:0;background:none;padding:0;color:var(--er-i);font-weight:600;cursor:pointer;text-decoration:underline;font-size:1em}
.formc{width:min(100%,40em);padding:1.3em;display:flex;flex-direction:column;gap:1em}
.formc .acts{display:flex;justify-content:flex-end;gap:.6em}
.sdemo2{display:flex;flex-direction:column;gap:1.1em;width:min(100%,46em)}
/* anatomy */
.anat{display:flex;flex-direction:column;align-items:center;gap:1.2em;width:100%}
/* states grid */
.sg4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1.1em 1.2em;width:100%}
.sgc{display:flex;flex-direction:column;gap:.5em;min-width:0}
.sgc>small{font-size:.74em;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.sgc .tok{font-family:var(--fm);font-size:.72em;color:var(--mut);line-height:1.35}
.sgc .tf{width:100%}
.isz{display:flex;gap:1.2em;align-items:flex-end;flex-wrap:wrap;justify-content:center;margin-top:1.4em}
.isz div{display:flex;flex-direction:column;gap:.4em;align-items:center;color:var(--mut);font-size:.85em}
.isz .ib{width:11em;font-size:14px;border-radius:10px}
/* choice controls */
.cbx,.rdo{display:inline-grid;place-items:center;width:1.25em;height:1.25em;border:1.5px solid var(--ctl);background:var(--sf);flex:none;transition:background .15s,border-color .15s;cursor:pointer;padding:0;position:relative}
.cbx{border-radius:.32em}.rdo{border-radius:50%}
.cbx .i{width:.9em;height:.9em;stroke-width:3;color:var(--on-acc);opacity:0}
.cbx[aria-checked=true],.cbx.on,.cbx[aria-checked=mixed],.cbx.ind{background:var(--acc-s);border-color:var(--acc-s)}
.cbx[aria-checked=true] .i,.cbx.on .i{opacity:1}
.cbx[aria-checked=mixed]::after,.cbx.ind::after{content:"";position:absolute;width:.6em;height:2px;background:var(--on-acc);border-radius:1px}
.rdo::after{content:"";width:.55em;height:.55em;border-radius:50%;background:var(--acc-s);transform:scale(0);transition:transform .15s}
.rdo[aria-checked=true],.rdo.on{border-color:var(--acc-s)}.rdo[aria-checked=true]::after,.rdo.on::after{transform:scale(1)}
.cbx:hover,.rdo:hover,.cbx.hov,.rdo.hov{border-color:var(--mut)}
.cbx.on.hov,.cbx[aria-checked=true]:hover{background:var(--acc-10);border-color:var(--acc-10)}
.cbx:focus-visible,.rdo:focus-visible,.cbx.is-f,.rdo.is-f,.sw.is-f,.seg2.is-f{outline:none;box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--acc)}
.cbx.dis,.rdo.dis,.sw.dis,.seg2.dis{opacity:.45;cursor:not-allowed}
.sw.hov{background:var(--mut)}
.chk{display:flex;align-items:center;gap:.6em;cursor:pointer}
.chk.sub{padding-left:1.8em}
.rcard{display:flex;gap:.7em;align-items:flex-start;padding:.75em .9em;border-radius:12px;border:1px solid var(--ln);background:var(--sf);cursor:pointer;transition:background .2s,border-color .2s;text-align:left;width:100%;font-size:1em}
.rcard.on{border-color:var(--acc-s);background:var(--acc-3)}
.rcard .rdo{margin-top:.12em}.rcard b{display:block}.rcard small{color:var(--mut)}
.seg2{display:inline-flex;gap:.2em;padding:.2em;border-radius:.7em;background:var(--s3)}
.seg2 button{border:0;background:transparent;padding:.4em .9em;border-radius:.55em;font-weight:600;color:var(--mut);cursor:pointer;font-size:1em}

   if(this.valEl){this.valEl.textContent=a.length?'':(o.placeholder||'');this.valEl.classList.toggle('ph',!a.length);this.valEl.style.display=a.length?'none':''}}

}

S.chart=store.get('charts',{});S.chartDef=store.get('chartdef','auto');S.brandC=Object.assign({},BRC0,store.get('brandc',{}));
const CHARTS={'dash.sales':['Net sales','Dashboard','#/dashboard','time'],'dash.brand':['Sales by brand','Dashboard','#/dashboard','cat',1],'dash.channel':['Website and POS','Dashboard','#/dashboard','cat'],'fin.method':['Collected by method','Finance','#/finance?tab=overview','cat'],'cust.brand':['Spend by brand','Customer page','#/customers/C001','cat',1],
 'rep.sales-brand':['Sales by brand','Reports','#/reports/sales-brand','cat',1],'rep.sales-location':['Sales by location','Reports','#/reports/sales-location','cat'],'rep.top-products':['Top products','Reports','#/reports/top-products','cat'],'rep.inventory-value':['Inventory value','Reports','#/reports/inventory-value','cat'],'rep.cod-aging':['COD aging','Reports','#/reports/cod-aging','cat'],'rep.vat':['VAT summary','Reports','#/reports/vat','cat',1]};
const PALN={auto:'Automatic',theme:'Theme',brand:'Brand colors',tints:'Category tints',mono:'Grays',cb:'Color-blind safe',custom:'Custom'};
const LASTK={};let CH_OPEN=null;
const surf=()=>effTheme()==='dark'?'#191919':'#FFFFFF';
function accHex(){const d=document.createElement('i');d.style.cssText='position:absolute;visibility:hidden;color:var(--acc-s)';$('#app').append(d);const c=readC(d,'color');d.remove();return rgb2hex(c.slice(0,3))}
const ensure3=(col,bg)=>{let x=col,t=0;const to=lum(bg)>.3?'#000000':'#FFFFFF';while(ratio(x,bg)<3&&t<1){t+=.04;x=mixH(col,to,t)}return x};
function chartCfg(id){const c=CHARTS[id],def=S.chartDef==='auto'?(c[4]?'brand':c[3]==='time'?'theme':'tints'):S.chartDef;return Object.assign({pal:def,mode:c[3]==='time'?'one':'each',items:{}},S.chart[id]||{})}
function palList(pal,keys){return palRaw(pal,keys).map(x=>ensure3(x,surf()))}
function palRaw(pal,keys){const A=accHex(),bg=surf(),dk=effTheme()==='dark';
 if(pal==='brand')return keys.map((k,i)=>S.brandC[k]||TINTS[i%5]);if(pal==='tints')return keys.map((k,i)=>TINTS[i%5]);if(pal==='cb')return keys.map((k,i)=>CBS[i%7]);
 if(pal==='mono'){const g=dk?['#EEEEEE','#C8C8C8','#ADADAD','#8D8D8D','#7A7A7A']:['#202020','#4A4A4A','#646464','#7A7A7A','#8D8D8D'];return keys.map((k,i)=>g[i%5])}
 const st=[0,.22,.38,.5,.6];return keys.map((k,i)=>mixH(A,bg,st[i%5]))}
function chartColors(id,keys,hiIdx){LASTK[id]=keys;const c=chartCfg(id),base=palList(c.pal==='custom'?'theme':c.pal,keys);
 if(c.mode==='one'){const one=c.one||base[0],hi=c.hi||one;if(CHARTS[id][3]==='time'){const soft=ensure3(mixH(one,surf(),.62),surf());return keys.map((k,i)=>i===hiIdx?hi:soft)}return keys.map(()=>one)}
 return keys.map((k,i)=>c.items[k]||base[i])}
const chBtn=id=>`<button class="ia chbtn" data-act="chartc" data-v="${id}" aria-label="Chart colors" title="Chart colors">${I('palette')}</button>`;
function saveCh(){store.set('charts',S.chart);store.set('chartdef',S.chartDef);store.set('brandc',S.brandC)}
function chChecks(id){const keys=LASTK[id]||[],cols=chartColors(id,keys,keys.length-1),bg=surf(),w=[];const uniq=[...new Set(cols)];
 cols.forEach((c,i)=>{const r=ratio(c,bg);if(r<3&&cols.indexOf(c)===i)w.push(`<b>${CHARTS[id][3]==='time'?(i===keys.length-1?'Latest bar':'Bars'):esc(String(keys[i]))}</b> is faint on the page (${r.toFixed(1)}:1 — charts need 3:1)`)});
 const d=(a,b)=>{const x=hex2(a),y=hex2(b);return Math.hypot(x[0]-y[0],x[1]-y[1],x[2]-y[2])};if(chartCfg(id).mode==='each')for(let i=0;i<cols.length;i++)for(let j=i+1;j<cols.length;j++)if(cols[i]!==cols[j]&&d(cols[i],cols[j])<55)w.push(`<b>${esc(keys[i])}</b> and <b>${esc(keys[j])}</b> look alike`);
 if(chartCfg(id).mode==='each'&&uniq.length<cols.length&&cols.length>1)w.push('Some items share the same color');
 return w.length?`<div class="alertb wa">${I('warn')}<div><b>Worth a second look</b><p class="mut">${w.slice(0,4).join('<br>')}</p></div></div>`:`<div class="alertb ok">${I('ok')}<div><b>Easy to read</b><p class="mut">Every color stands out from the page${chartCfg(id).mode==='each'?' and from each other':''}.</p></div></div>`}
function chPreview(id){const keys=(LASTK[id]||[]).slice(0,12),cols=chartColors(id,keys,keys.length-1),t=CHARTS[id][3]==='time';return t?`<div class="bars" style="height:5em">${keys.map((k,i)=>`<i style="height:${30+((i*37)%70)}%;background:${cols[i]}"></i>`).join('')}</div>`:`<div class="blist">${keys.slice(0,6).map((k,i)=>`<div class="xbrow" style="grid-template-columns:8em 1fr"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(k)}</span><span class="xtr"><i style="width:${100-i*14}%;background:${cols[i]}"></i></span></div>`).join('')}</div>`}
function chartDrawer(id){const c=CHARTS[id],cfg=chartCfg(id),keys=LASTK[id]||[],cols=chartColors(id,keys,keys.length-1),t=c[3]==='time';
 const pals=['theme','brand','tints','mono','cb'].filter(p=>p!=='brand'||c[4]);
 const row=(label,key,col)=>`<div class="chrow"><span>${esc(label)}</span><label class="sw2 cus on" style="--cv:${col};background:${col}"><input type="color" data-chc="${esc(key)}" value="${col}" aria-label="Color for ${esc(label)}"></label><code>${col}</code></div>`;
 drawer('Chart colors',`<div class="xrow"><b>${c[0]}</b><span class="mut">· ${c[1]}</span></div><div class="cardx" id="chpv" style="box-shadow:none">${chPreview(id)}</div>
 <div class="czrow"><div class="czl"><b>Palette</b><small>Start from a set, then change any color</small></div><div class="czsw2">${pals.map(p=>`<button class="sw2 txt${cfg.pal===p?' on':''}" data-act="chpal" data-v="${p}">${PALN[p]}</button>`).join('')}${cfg.pal==='custom'?'<span class="sw2 txt on">Custom</span>':''}</div></div>
 <div class="czrow"><div class="czl"><b>Coloring</b></div><div class="seg2"><button data-act="chmode" data-v="one" class="${cfg.mode==='one'?'on':''}">${t?'One color and a highlight':'One color'}</button><button data-act="chmode" data-v="each" class="${cfg.mode==='each'?'on':''}">A color for each</button></div></div>
 <div class="czrow" id="chrows">${cfg.mode==='one'?row(t?'Bars':'All bars','__one',cfg.one||palList(cfg.pal==='custom'?'theme':cfg.pal,['x'])[0])+(t?row('Latest (highlight)','__hi',cfg.hi||cfg.one||palList(cfg.pal==='custom'?'theme':cfg.pal,['x'])[0]):''):keys.slice(0,12).map((k,i)=>row(String(k).replace(/^d(\d+)$/,'Bar $1'),k,cols[i])).join('')}</div>
 <div id="chchk">${chChecks(id)}</div>`,`<button class="b b-ter" data-act="chreset" data-v="${id}">Reset</button><button class="b b-sec" data-act="chall" data-v="${id}">Use on all charts</button><button class="b b-pri" data-act="drwclose">Done</button>`,d=>{d.dataset.chart=id;
  $$('[data-chc]',d).forEach(inp=>inp.addEventListener('input',()=>{const k=inp.dataset.chc,v=inp.value.toUpperCase(),cf=S.chart[id]=Object.assign({items:{}},S.chart[id]||{},{pal:'custom'});if(!cf.mode)cf.mode=chartCfg(id).mode;if(k==='__one')cf.one=v;else if(k==='__hi')cf.hi=v;else cf.items[k]=v;const lab=inp.parentElement;lab.style.setProperty('--cv',v);lab.style.background=v;lab.nextElementSibling.textContent=v;saveCh();rerender();$('#chpv').innerHTML=chPreview(id);$('#chchk').innerHTML=chChecks(id)}))})}
function chartsSection(){const groups={};Object.entries(CHARTS).forEach(([id,c])=>{(groups[c[1]]=groups[c[1]]||[]).push([id,c])});
 return `<div class="czsec"><h4>Charts</h4><div class="czrow"><div class="czl"><b>Default palette</b><small>For every chart you haven’t changed</small></div><div class="czsw2">${['auto','theme','tints','mono','cb'].map(p=>`<button class="sw2 txt${S.chartDef===p?' on':''}" data-act="chdef" data-v="${p}">${PALN[p]}</button>`).join('')}</div></div>
 <div class="czrow"><div class="czl"><b>Brand colors</b><small>Used wherever a chart shows brands</small></div>${Object.keys(BR).map(b=>`<div class="chrow"><span class="xrow nw">${bav(b)}${b}</span><label class="sw2 cus on" style="--cv:${S.brandC[b]};background:${S.brandC[b]}"><input type="color" data-brc="${b}" value="${S.brandC[b]}" aria-label="${b} color"></label><code>${S.brandC[b]}</code></div>`).join('')}</div>
 <div class="czrow"><div class="czl"><b>Each chart</b><small>Open a chart to change its colors one by one</small></div>${Object.entries(groups).map(([g,a])=>`<div class="chlist"><small class="mut">${g}</small>${a.map(([id,c])=>`<button class="chli" data-act="chgo" data-v="${id}"><span>${c[0]}</span><span class="mut">${S.chart[id]?PALN[S.chart[id].pal]||'Custom':'Default'}</span>${I('right')}</button>`).join('')}</div>`).join('')}</div>
 <button class="b b-ter" data-act="chresetall" style="align-self:flex-start">Reset all chart colors</button></div>`}
Object.assign(ACT,{
 chartc:t=>chartDrawer(t.dataset.v),
 chpal:t=>{const id=$('#adrw').dataset.chart;S.chart[id]={pal:t.dataset.v,mode:chartCfg(id).mode,items:{}};saveCh();rerender();chartDrawer(id)},
 chmode:t=>{const id=$('#adrw').dataset.chart,cf=S.chart[id]=Object.assign({items:{}},chartCfg(id),S.chart[id]||{});cf.mode=t.dataset.v;saveCh();rerender();chartDrawer(id)},
 chreset:t=>{delete S.chart[t.dataset.v];saveCh();rerender();chartDrawer(t.dataset.v);toast('Chart colors reset',{kind:'in'})},
 chall:t=>{const src=chartCfg(t.dataset.v);Object.keys(CHARTS).forEach(id=>{if(id!==t.dataset.v)S.chart[id]={pal:src.pal==='custom'?'theme':src.pal,mode:CHARTS[id][3]==='time'?'one':src.mode,one:src.one,hi:src.hi,items:{}}});saveCh();rerender();toast('Palette used on every chart',{sub:'Item colors stay on this chart only'})},
 chdef:t=>{S.chartDef=t.dataset.v;saveCh();rerender();customize();toast('Default chart palette: '+PALN[S.chartDef])},
 chgo:t=>{const id=t.dataset.v;closeDrawer();CH_OPEN=id;const h=CHARTS[id][2];if(location.hash===h){CH_OPEN=null;setTimeout(()=>chartDrawer(id),60)}else location.hash=h},
 chresetall:()=>{S.chart={};S.chartDef='auto';S.brandC=Object.assign({},BRC0);saveCh();rerender();customize();toast('All chart colors reset',{kind:'in'})}});
document.addEventListener('input',e=>{const b=e.target.closest&&e.target.closest('[data-brc]');if(!b)return;S.brandC[b.dataset.brc]=b.value.toUpperCase();const lab=b.parentElement;lab.style.background=b.value;lab.nextElementSibling.textContent=b.value.toUpperCase();saveCh();rerender()});

BOOT();
})();</script>
</body>
</html>
